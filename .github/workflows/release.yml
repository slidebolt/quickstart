name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags "-X github.com/slidebolt/quickstart/app.Version=${GITHUB_REF_NAME}" -o "dist/slidebolt_${GOOS}_${GOARCH}" ./cmd/slidebolt
          (cd dist && sha256sum "slidebolt_${GOOS}_${GOARCH}" > "slidebolt_${GOOS}_${GOARCH}.sha256")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/slidebolt_${{ matrix.goos }}_${{ matrix.goarch }}
            dist/slidebolt_${{ matrix.goos }}_${{ matrix.goarch }}.sha256

